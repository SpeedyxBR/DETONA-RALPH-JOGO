<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jogo Detona Ralph - Clique no Ralph antes que ele desapareça!"
    />
    <meta
      name="keywords"
      content="jogo, detona ralph, diversão, clicar, pontuação"
    />
    <title>Detona Ralph - Jogo de Habilidade</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./src/imagens/favicon.jpg" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos -->
    <link rel="stylesheet" href="./src/styles/reset.css" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <main class="container">
      <!-- Header do jogo -->
      <header class="menu" role="banner">
        <div class="menu-time">
          <h2>Tempo Restante</h2>
          <h2 id="time-left" aria-live="polite">60</h2>
        </div>
        <div class="menu-score">
          <h2>Sua Pontuação</h2>
          <h2 id="score" aria-live="polite">0</h2>
        </div>
        <div class="menu-lives">
          <img
            src="./src/imagens/player.png"
            alt="Ícone do jogador"
            height="60"
            width="60"
          />
          <h2 id="lives" aria-live="polite">x3</h2>
        </div>
      </header>

      <!-- Área de jogo -->
      <section class="game-area" role="main">
        <div class="panel" role="grid" aria-label="Grade do jogo">
          <div class="panel-row">
            <button
              class="square"
              id="1"
              aria-label="Quadrado 1"
              tabindex="1"
            ></button>
            <button
              class="square"
              id="2"
              aria-label="Quadrado 2"
              tabindex="2"
            ></button>
            <button
              class="square"
              id="3"
              aria-label="Quadrado 3"
              tabindex="3"
            ></button>
          </div>

          <div class="panel-row">
            <button
              class="square"
              id="4"
              aria-label="Quadrado 4"
              tabindex="4"
            ></button>
            <button
              class="square"
              id="5"
              aria-label="Quadrado 5"
              tabindex="5"
            ></button>
            <button
              class="square"
              id="6"
              aria-label="Quadrado 6"
              tabindex="6"
            ></button>
          </div>

          <div class="panel-row">
            <button
              class="square"
              id="7"
              aria-label="Quadrado 7"
              tabindex="7"
            ></button>
            <button
              class="square"
              id="8"
              aria-label="Quadrado 8"
              tabindex="8"
            ></button>
            <button
              class="square"
              id="9"
              aria-label="Quadrado 9"
              tabindex="9"
            ></button>
          </div>
        </div>
      </section>

      <!-- Controles do jogo -->
      <section class="controls" role="complementary">
        <button id="start-btn" class="btn btn-primary">Iniciar Jogo</button>
        <button id="restart-btn" class="btn btn-secondary">Reiniciar</button>
      </section>
    </main>

    <!-- Modal de Game Over -->
    <div
      id="game-over-modal"
      class="modal"
      role="dialog"
      aria-labelledby="game-over-title"
      aria-hidden="true"
    >
      <div class="modal-content">
        <h2 id="game-over-title">Game Over!</h2>
        <p id="final-score">
          Sua pontuação final: <span id="final-score-value">0</span>
        </p>
        <div class="modal-buttons">
          <button id="play-again-btn" class="btn btn-primary">
            Jogar Novamente
          </button>
          <button id="view-ranking-btn" class="btn btn-secondary">
            Ver Ranking
          </button>
        </div>
      </div>
    </div>

    <!-- Modal de Ranking -->
    <div
      id="ranking-modal"
      class="modal"
      role="dialog"
      aria-labelledby="ranking-title"
      aria-hidden="true"
    >
      <div class="modal-content ranking-content">
        <h2 id="ranking-title">🏆 Ranking de Pontuações</h2>
        <div class="ranking-container">
          <table class="ranking-table">
            <thead>
              <tr>
                <th>Posição</th>
                <th>Nome</th>
                <th>Pontuação</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="ranking-tbody">
              <!-- Ranking será preenchido via JavaScript -->
            </tbody>
          </table>
        </div>
        <div class="modal-buttons">
          <button id="close-ranking-btn" class="btn btn-primary">Fechar</button>
          <button id="clear-ranking-btn" class="btn btn-danger">
            Limpar Ranking
          </button>
        </div>
      </div>
    </div>

    <script defer src="./src/scripts/engine.js"></script>
  </body>
</html>
